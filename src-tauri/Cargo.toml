[package]
name = "mission-builder"
version = "0.2.0"
description = "Mission Builder - build and run Nav2 missions without writing code"
authors = ["phuwanat@SUT IRISH LAB"]
edition = "2021"

[lib]
name = "mission_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
